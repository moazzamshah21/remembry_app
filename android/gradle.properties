# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=false

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# CRITICAL: Enable 16 KB page size support for Android 15+
# This property tells AGP to ensure all native libraries are aligned to 16 KB boundaries
# Required for Google Play compliance starting Nov 1, 2025
android.enable16kPages=true

# Enable 16 KB page size support for newer Android devices (Android 15+ requirement)
# AGP 8.7.1 automatically handles 16 KB zip alignment for native libraries
# The extractNativeLibs="false" in AndroidManifest.xml ensures native libs remain uncompressed
# AGP 8.7.1 automatically aligns uncompressed native libraries to 16 KB boundaries in AABs
#
# IMPORTANT: 
# - CRITICAL: React Native 0.77+ is required for 16KB page size support
# - React Native 0.76 does NOT natively support 16KB page memory size
# - Using NDK r26.1.10909125 (required for react-native-reanimated compatibility)
# - NDK r28+ is recommended for best 16KB compatibility (compiles with 16KB alignment by default)
# - If react-native-reanimated supports it, upgrade to NDK r28+ for optimal 16KB support
# - AGP 8.5.1+ automatically handles 16 KB zip alignment for native libraries (8.7.1 is used)
# - React Native 0.77+ compiles with proper 16 KB ELF alignment when using AGP 8.5.1+
# - This configuration supports 16 KB page sizes required for Android 15+
# - Ensure all third-party native libraries (react-native-reanimated, Firebase, Stripe) are updated
# - Prebuilt libraries from dependencies must also be 16 KB-aligned

# Suppress compileSdk warnings (AGP 8.5.2 supports SDK 36)
android.suppressUnsupportedCompileSdk=36

# Suppress Kotlin version compatibility check for Compose Compiler
# This fixes the Stripe library build error with Kotlin 1.9.22
# The Compose Compiler will use a compatible version automatically
org.jetbrains.kotlin.android.suppressKotlinVersionCompatibilityCheck=true
