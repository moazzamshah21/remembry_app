/**
 * This is the configuration block to customize your React Native Android app.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.digitalsoftwarelabs.reminderapp"
    defaultConfig {
        applicationId "com.digitalsoftwarelabs.reminderapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 16
        versionName "1.0.7"
        
        // NDK configuration for 16 KB page size support
        // CRITICAL: React Native 0.77+ is required for 16KB page size support
        // React Native 0.76 does NOT natively support 16KB page memory size
        // Using NDK r26 (required by react-native-reanimated compatibility)
        // NDK r28+ is recommended for best 16KB compatibility (if react-native-reanimated supports it)
        // AGP 8.7.1 with android.enable16kPages=true handles 16 KB alignment
        // This configuration supports 16 KB page sizes required for Android 15+
        ndk {
            // Filter ABIs to only include supported architectures
            // This prevents issues with missing native libraries for unsupported ABIs
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }
    
    signingConfigs {
        debug {
            // Use default debug config
        }
        release {
            storeFile file('digitalsoftwarelabs.keystore')
            storePassword 'digitalsoftwarelabs'
            keyAlias 'digitalsoftwarelabs'
            keyPassword 'digitalsoftwarelabs'
        }
    }
    
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    
    // CRITICAL: Java and Kotlin JVM target alignment
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = "17"
    }
    
    // Packaging options for 16 KB page size support
    // CRITICAL: React Native 0.77+ is required for 16KB page size support
    // React Native 0.76 does NOT natively support 16KB page memory size
    // Native libraries must not be compressed and must be zip-aligned for 16 KB pages
    // AGP 8.7.1 automatically aligns uncompressed native libraries to 16 KB boundaries
    packaging {
        jniLibs {
            // 16 KB page size support: extractNativeLibs="false" requires useLegacyPackaging = false
            // React Native 0.77+ properly handles native library packaging with 16KB support
            // AGP 8.5.1+ automatically handles 16 KB zip alignment for native libraries
            useLegacyPackaging = false
        }
        resources {
            excludes += ['META-INF/*', 'META-INF/**']
        }
    }
    
    // Bundle configuration for 16 KB page size support
    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = false
        }
        abi {
            enableSplit = true
        }
    }
    
    // Configure splits to handle missing native libraries gracefully
    // This helps prevent build failures when libraries don't provide all ABIs
    splits {
        abi {
            enable false  // Disable splits for debug builds to avoid merge issues
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk false
        }
    }
}

// Autolinked modules are automatically included as project dependencies by React Native 0.77
// The com.facebook.react plugin handles this automatically based on autolinking.json
// No need to manually add them here - they're included via PackageList

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    
    // Flipper is optional in React Native 0.77 - only include if needed for debugging
    // implementation("com.facebook.react:flipper-integration")
    
    // Kotlin standard library - MUST match the version in build.gradle
    // Force Kotlin 2.0.21 to avoid compatibility issues
    implementation("org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion") {
        version {
            strictly "$kotlinVersion"
        }
    }
    
    // Other dependencies
    implementation("com.facebook.android:facebook-android-sdk:17.0.0")
    
    // Hermes configuration
    def hermesEnabled = true
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    
    // React Native 0.77 autolinking should automatically add project dependencies
    // But if it's not working, we need to explicitly add them
    // Check if autolinked modules are available as subprojects and add them
    def autolinkingFile = file("../../android/build/generated/autolinking/autolinking.json")
    if (autolinkingFile.exists()) {
        def autolinkingJson = new groovy.json.JsonSlurper().parse(autolinkingFile)
        autolinkingJson.dependencies.each { name, config ->
            def androidConfig = config.platforms?.android
            if (androidConfig && androidConfig.sourceDir) {
                def projectPath = ":${name.replace('@', '').replace('/', '_')}"
                if (project.findProject(projectPath) != null) {
                    implementation(project(projectPath))
                }
            }
        }
    }
}

// Native modules are auto-linked by React Native 0.77 gradle plugin (com.facebook.react)
// No need to manually apply native_modules.gradle

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

// CRITICAL: Force Kotlin to use JVM 17 target for ALL compilation tasks
// This ensures no library overrides the JVM target
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
    }
}

// Force Kotlin version resolution to avoid compatibility issues
configurations.all {
    resolutionStrategy {
        force("org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion")
        force("org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion")
        force("org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinVersion")
    }
}

// Fix for merge tasks - handle missing cache/output directories gracefully
afterEvaluate {
    // Fix for mergeDebugNativeLibs task - handle missing native libraries gracefully
    tasks.matching { it.name.startsWith("merge") && it.name.endsWith("NativeLibs") }.configureEach { task ->
        task.doFirst {
            // Ensure output directories exist for all ABIs before merging
            try {
                def outputDir = task.outputs.files.files.find { it.name.contains("merged_native_libs") }
                if (outputDir != null) {
                    ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].each { abi ->
                        def abiDir = new File(outputDir, "out/lib/${abi}")
                        if (!abiDir.exists()) {
                            abiDir.mkdirs()
                        }
                    }
                }
            } catch (Exception e) {
                // Log but don't fail if directory creation fails
                println "Warning: Could not create native lib directories: ${e.message}"
            }
        }
    }
    
    // Fix for mergeDebugJavaResource task - handle missing cache directory
    tasks.matching { it.name.startsWith("merge") && it.name.endsWith("JavaResource") }.configureEach { task ->
        task.doFirst {
            try {
                // Ensure cache directory exists
                def cacheDir = new File(project.buildDir, "intermediates/incremental/debug-mergeJavaRes/zip-cache")
                if (!cacheDir.exists()) {
                    cacheDir.mkdirs()
                }
                
                // Also ensure output directories exist
                task.outputs.files.files.each { outputFile ->
                    if (outputFile.exists()) {
                        outputFile.parentFile?.mkdirs()
                    }
                }
            } catch (Exception e) {
                println "Warning: Could not create Java resource cache directories: ${e.message}"
            }
        }
    }
    
    // Generic fix for all merge tasks - ensure output directories exist
    tasks.matching { it.name.contains("merge") && !it.name.contains("Resources") }.configureEach { task ->
        task.doFirst {
            try {
                // Ensure all output directories exist
                task.outputs.files.files.each { outputFile ->
                    def parentDir = outputFile.parentFile
                    if (parentDir != null && !parentDir.exists()) {
                        parentDir.mkdirs()
                    }
                }
            } catch (Exception e) {
                // Silently handle - this is just a safety measure
            }
        }
    }
}